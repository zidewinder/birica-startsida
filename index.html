
<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a85f31">
<title>BIRICA – When Dreams Comes True</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  color: #fff7ed;
  background: #35261e;
}

.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: max(24px, env(safe-area-inset-top)) 22px
           max(12px, env(safe-area-inset-bottom));
}

.page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, #ffe0b433, #25170d40),
    url("assets/selma-sunset.jpg") center 55% / cover no-repeat;
}

.page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg, #fff0d622 0%, transparent 45%, #1e130d22 100%
  );
  pointer-events: none;
}

.brand {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 2vh;
}

.logo {
  display: block;
  width: min(88%, 430px);
  height: auto;
  object-fit: contain;
}

.tagline {
  margin-top: 10px;
  text-align: center;
  color: #30251f;
  font-size: clamp(16px, 4.5vw, 22px);
  letter-spacing: .025em;
  font-weight: 500;
  text-shadow: 0 1px 8px #fff4e8aa;
}

.main {
  width: min(100%, 480px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  margin-top: clamp(30px, 6vh, 60px);
}

.card {
  display: block;
  width: 100%;
  overflow: hidden;
  border: 2px solid #fff0dc;
  border-radius: 22px;
  box-shadow: 0 8px 26px #24150d55;
  line-height: 0;
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 2.35 / 1;
  object-fit: cover;
}

.navrow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
}

.arrow {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 1.5px solid #fff3e3;
  border-radius: 50%;
  background: #a85f31;
  color: white;
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.swipe {
  min-width: 76px;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .12em;
  text-shadow: 0 2px 8px #392015;
}

.spacer {
  flex: 1;
  min-height: 20px;
}

@media (max-height: 720px) {
  .brand { margin-top: 0; }
  .logo { width: min(72%, 320px); }
  .tagline { margin-top: 6px; font-size: 16px; }
  .main { margin-top: 22px; gap: 12px; }
  .arrow { width: 42px; height: 42px; }
  .spacer { min-height: 8px; }
}
</style>
</head>
<body>
<div class="page">

  <header class="brand">
    <img class="logo"
         src="assets/birica-logo.png"
         alt="BIRICA">
    <div class="tagline">When Dreams Comes True</div>
  </header>

  <main class="main">
    <a class="card"
       href="https://birica-discgolf.vercel.app/"
       aria-label="Öppna Birica Discgolf">
      <img src="assets/discgolf-card.jpg"
           alt="Birica Discgolf">
    </a>

    <div class="navrow" aria-label="Navigering mellan appar">
      <button class="arrow" id="prev" aria-label="Föregående app">‹</button>
      <span class="swipe" id="swipe">Swipe</span>
      <button class="arrow" id="next" aria-label="Nästa app">›</button>
    </div>
  </main>

  <div class="spacer"></div>
</div>

<script>
let startX = null;
let noticeTimer;

function showNotice() {
  const label = document.getElementById("swipe");
  label.textContent = "Fler appar kommer";
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    label.textContent = "Swipe";
  }, 1400);
}

document.getElementById("prev").addEventListener("click", showNotice);
document.getElementById("next").addEventListener("click", showNotice);

document.querySelector(".page").addEventListener("touchstart", e => {
  startX = e.changedTouches[0].clientX;
}, { passive: true });

document.querySelector(".page").addEventListener("touchend", e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 65) showNotice();
  startX = null;
}, { passive: true });
</script>
</body>
</html>
