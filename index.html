<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#281710">
<meta name="description" content="BIRICA – When Dreams Come True">
<title>BIRICA – When Dreams Come True</title>
<style>
:root{color-scheme:dark;--gold:#e5b66f;--gold2:#f0ca83;--text:#f7f0e7;--line:#805638}
*{box-sizing:border-box}
html{min-height:100%;background:#1b120f}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(rgba(27,18,15,.50),rgba(27,18,15,.72)),url("birica-startsida-bakgrund.jpg") center top/cover fixed,#1b120f}
.hero{width:100%;background:#281710;border-bottom:2px solid var(--line);overflow:hidden}
.hero img{display:block;width:100%;height:auto}
main{width:min(100% - 28px,780px);margin:0 auto;padding:22px 0 30px}
.intro{text-align:center;margin:0 auto 22px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.intro h1{margin:0 0 6px;color:var(--gold2);font-size:clamp(23px,5vw,32px)}
.intro p{margin:0;color:var(--text);font-size:clamp(14px,2.7vw,17px)}
.apps{display:grid;gap:15px;width:82%;max-width:500px;margin:0 auto}
.app-card{display:block;width:100%;overflow:hidden;border-radius:22px;text-decoration:none;line-height:0;box-shadow:0 12px 22px rgba(0,0,0,.58),0 4px 7px rgba(0,0,0,.35);transition:transform .16s ease,box-shadow .16s ease;-webkit-tap-highlight-color:transparent}
.app-card img{display:block;width:100%;height:auto}
.app-card:hover,.app-card:focus-visible{transform:translateY(-2px);box-shadow:0 17px 29px rgba(0,0,0,.68),0 0 0 2px rgba(229,182,111,.45)}
.app-card:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
footer{padding:0 12px 26px;text-align:center;color:#d1a16b;text-shadow:0 2px 8px #000;font-size:13px;letter-spacing:.03em}
@media(min-width:700px){main{padding-top:30px}.apps{gap:17px;width:82%;max-width:500px}}
@media(max-width:420px){main{width:calc(100% - 22px);padding-top:18px}.apps{gap:12px;width:84%;}.app-card{border-radius:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero"><img src="birica-welcome-header.png" alt="BIRICA – When Dreams Come True – WELCOME, med Selma vid solnedgången"></header>
<main>
<nav class="apps" aria-label="BIRICA-appar">
<a class="app-card" href="https://birica-discgolf.vercel.app/" aria-label="Öppna BIRICA Discgolf"><img src="birica-card-discgolf.png" alt="BIRICA Discgolf – Spela, registrera, utvecklas"></a>
<a class="app-card" href="https://birica-ekonomi.vercel.app/" aria-label="Öppna BIRICA Ekonomi"><img src="birica-card-ekonomi.png" alt="BIRICA Ekonomi – Planera, få koll, njut mer"></a>
<a class="app-card" href="#" aria-label="BIRICA Framtid – kommer senare" onclick="event.preventDefault();alert('BIRICA Framtid kommer snart!');"><img src="birica-card-framtid.png" alt="BIRICA Framtid – Idéer, planer, möjligheter"></a>
<a class="app-card" href="#" aria-label="BIRICA Retro – kommer snart" onclick="event.preventDefault();alert('BIRICA Retro kommer snart!');"><img src="birica-card-retro.png" alt="BIRICA Retro – Klassiker, spelminnen, guldåren"></a>
</nav>
</main>
</body></html>
