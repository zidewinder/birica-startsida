
<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#30251f">
<title>BIRICA – When Dreams Come True</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: #30251f;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding:
    env(safe-area-inset-top, 0px)
    20px
    env(safe-area-inset-bottom, 0px);
}

.background {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}

.app-area {
  width: min(100%, 280px);
  margin-top: clamp(190px, 32vh, 290px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.discgolf-link {
  display: block;
  width: 100%;
  border: 2px solid rgba(255, 242, 225, 0.9);
  border-radius: 17px;
  overflow: hidden;
  line-height: 0;
  box-shadow: 0 7px 22px rgba(25, 15, 8, 0.28);
  -webkit-tap-highlight-color: transparent;
}

.discgolf-link img {
  display: block;
  width: 100%;
  height: auto;
}

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  padding: 1px 8px;
}

.dot {
  display: block;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 1px 5px rgba(25, 15, 8, 0.18);
}

.dot.active {
  background: #fff;
}

@media (max-height: 760px) {
  .app-area {
    margin-top: 36vh;
  }

  .discgolf-link {
    width: 94%;
  }
}

@media (max-width: 380px) {
  .page {
    padding-left: 16px;
    padding-right: 16px;
  }

  .app-area {
    margin-top: clamp(220px, 39vh, 330px);
  }
}
</style>
</head>

<body>
<div class="page">

  <img
    class="background"
    src="assets/birica-background.png"
    alt=""
    aria-hidden="true"
  >

  <main class="content">
    <section class="app-area" aria-label="Biricas appar">

      <a
        class="discgolf-link"
        href="https://birica-discgolf.vercel.app/"
        aria-label="Öppna Birica Discgolf"
      >
        <img
          src="assets/birica-discgolf-card.png"
          alt="Birica Discgolf"
        >
      </a>

      <div class="pagination" aria-label="App 1 av 3">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </section>
  </main>
</div>
</body>
</html>
