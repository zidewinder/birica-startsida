
<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#30251f">
<title>BIRICA – When Dreams Come True</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: #30251f;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding:
    env(safe-area-inset-top, 0px)
    20px
    env(safe-area-inset-bottom, 0px);
}

.background {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(35, 23, 16, 0.04) 0%,
    rgba(35, 23, 16, 0.02) 55%,
    rgba(25, 17, 12, 0.20) 100%
  );
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}

.app-area {
  width: min(100%, 440px);
  margin-top: clamp(250px, 42vh, 390px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.discgolf-link {
  display: block;
  width: 100%;
  border: 2px solid rgba(255, 242, 225, 0.9);
  border-radius: 17px;
  overflow: hidden;
  line-height: 0;
  box-shadow: 0 7px 22px rgba(25, 15, 8, 0.28);
  -webkit-tap-highlight-color: transparent;
}

.discgolf-link img {
  display: block;
  width: 100%;
  height: auto;
}

.navigation {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  color: #fff6e9;
  text-shadow: 0 2px 8px rgba(25, 15, 8, 0.8);
}

.arrow {
  appearance: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 246, 233, 0.9);
  border-radius: 50%;
  background: rgba(157, 91, 49, 0.92);
  color: white;
  font-size: 29px;
  line-height: 1;
  cursor: pointer;
}

.swipe {
  min-width: 68px;
  text-align: center;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: 0.12em;
}

@media (max-height: 760px) {
  .app-area {
    margin-top: 36vh;
  }

  .discgolf-link {
    width: 94%;
  }

  .arrow {
    width: 40px;
    height: 40px;
  }
}
</style>
</head>
<body>
<div class="page">
  <img
    class="background"
    src="assets/birica-background.png"
    alt=""
    aria-hidden="true"
  >

  <div class="overlay" aria-hidden="true"></div>

  <main class="content">
    <section class="app-area" aria-label="Biricas appar">
      <a
        class="discgolf-link"
        href="https://birica-discgolf.vercel.app/"
        aria-label="Öppna Birica Discgolf"
      >
        <img
          src="assets/discgolf-card.jpg"
          alt="Birica Discgolf"
        >
      </a>

      <nav class="navigation" aria-label="Navigering">
        <button class="arrow" id="previous" aria-label="Föregående app">‹</button>
        <span class="swipe" id="swipe-label">Swipe</span>
        <button class="arrow" id="next" aria-label="Nästa app">›</button>
      </nav>
    </section>
  </main>
</div>

<script>
let startX = null;
let noticeTimer;

function showComingSoon() {
  const label = document.getElementById("swipe-label");
  label.textContent = "Fler appar kommer";

  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    label.textContent = "Swipe";
  }, 1400);
}

document
  .getElementById("previous")
  .addEventListener("click", showComingSoon);

document
  .getElementById("next")
  .addEventListener("click", showComingSoon);

document
  .querySelector(".page")
  .addEventListener("touchstart", event => {
    startX = event.changedTouches[0].clientX;
  }, { passive: true });

document
  .querySelector(".page")
  .addEventListener("touchend", event => {
    if (startX === null) return;

    const distance = event.changedTouches[0].clientX - startX;

    if (Math.abs(distance) > 65) {
      showComingSoon();
    }

    startX = null;
  }, { passive: true });
</script>
</body>
</html>
